[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-accelerator-reliability-intelligence"
version = "0.1.0"
description = "FastAPI service for cross-layer telemetry/log fusion, anomaly detection, risk scoring, and reliability recommendations for AI accelerator fleets (working prototype with bundled sample data)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tony Lee" }]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["app", "app.api", "app.models", "app.services"]

[tool.mypy]
python_version = "3.11"
# Progressive strictness: every function must be annotated
# (disallow_untyped_defs) and functions must not silently return Any.
# Scope: `mypy app src scripts` (see CI). Tests are not type-checked yet.
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
